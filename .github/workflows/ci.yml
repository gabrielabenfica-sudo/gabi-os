name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gabi
          POSTGRES_PASSWORD: gabi
          POSTGRES_DB: gabi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gabi" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://gabi:gabi@localhost:5432/gabi
      SHADOW_DATABASE_URL: postgresql://gabi:gabi@localhost:5432/gabi_shadow
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY_CI || 'MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=' }}
      APP_URL: http://localhost:3100
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Aplicar migrações
        run: npx prisma migrate deploy

      - name: Verificar se o schema e as migrações estão sincronizados
        run: |
          psql postgresql://gabi:gabi@localhost:5432/gabi -c "CREATE DATABASE gabi_shadow"
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Testes unitários
        run: npx vitest run --project unit --reporter=default --reporter=github-actions

      - name: Testes de integração (Postgres)
        run: npx vitest run --project integration --reporter=default --reporter=github-actions

      - name: Build de produção
        run: npm run build

      - name: Preparar banco limpo para o E2E
        run: npx prisma migrate reset --force --skip-seed

      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes end-to-end
        run: npm run test:e2e

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
