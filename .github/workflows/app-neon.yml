name: App (Neon + Render)

# Confere o app publicado no Render (branch enter-neon) antes de publicar:
# build do site, testes do servidor e das regras do quadro.
on:
  push:
    branches: [enter-neon, "feat/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: node --experimental-strip-types --test tests/
      - run: cd server && npm install --no-audit --no-fund && node --test
